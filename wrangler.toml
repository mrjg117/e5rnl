name = "e5rnl"
main = "worker.js"
compatibility_date = "2024-09-23"

# 固定周期触发。每轮是否真正执行，由 RUN_PROBABILITY 决定。
[triggers]
crons = ["*/30 * * * *"]

[vars]
# ── 调度控制 ──
RUN_PROBABILITY = "0.5"
# SELF_TEST = "0"
# WORKER_URL = "https://your-worker.your-sub.workers.dev"

# ── timing ──
ACTION_DELAY_MIN_MS = "0"
ACTION_DELAY_MAX_MS = "300"
START_DELAY_MAX_SEC = "0"

# ── 性能 ──
CONCURRENCY = "6"
MAX_API_CALLS = "48"
MAX_RUNTIME_MS = "28000"

# ── Azure / Microsoft（全部明文变量，不用 secret）──
# 鉴权二选一：MS_APP_SECRET（客户端密码）或 MS_CERT_PEM + MS_CERT_PKEY（证书，指纹自动算）
MS_TENANT_ID = "your-tenant-id"
MS_APP_ID = "your-app-id"
USER_ACCOUNT = "user@your-domain.onmicrosoft.com"
# MS_APP_SECRET = "your-client-secret"        # 客户端密码（与证书二选一，用证书则注释掉）
MS_CERT_PEM = "your-cert-pem"                 # X.509 证书 PEM 全文（指纹自动算）
MS_CERT_PKEY = "your-private-key-pem"         # 私钥 PEM 全文（PKCS#8）
SHAREPOINT_SITE_ID = ""                       # 留空自动探测
SHAREPOINT_LIST_ID = ""                       # 留空自动探测
